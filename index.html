    <script>
      // 1. Bloquear clique direito (menu de contexto)
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      // 2. Bloquear teclas de atalho (DevTools, Código Fonte, Salvar)
      document.addEventListener('keydown', function(e) {
        // F12
        if (e.keyCode === 123 || e.key === 'F12') {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Chrome/Firefox DevTools)
        // Cmd+Option+I, Cmd+Option+J, Cmd+Option+C (Mac DevTools)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+U / Cmd+U (Código Fonte)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
          e.preventDefault();
          return false;
        }
        // Ctrl+S / Cmd+S (Salvar Página)
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
          e.preventDefault();
          return false;
        }
        // Bloquear atalhos de Zoom (Ctrl + '+' / '-' / '0')
        if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '-' || e.key === '0' || e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.keyCode === 96 || e.keyCode === 97)) {
          e.preventDefault();
          return false;
        }
      });

      // 3. Bloquear zoom por Ctrl + Wheel (Roda do mouse)
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // 4. Bloquear zoom por toque/pinça (pinch-to-zoom) no celular
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        if (e.scale && e.scale !== 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 5. Anti-debugger (se abrirem o console pelo menu do navegador, o debugger congela a execução)
      setInterval(function() {
        (function() {
          const start = new Date();
          debugger;
          const end = new Date();
          if (end - start > 100) {
            console.clear();
          }
        })();
      }, 500);
    </script>
